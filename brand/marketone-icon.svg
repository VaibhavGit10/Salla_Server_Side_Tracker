<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="MarketOne app icon">
  <defs>
    <linearGradient id="mo-bg" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E01C7A"/>
      <stop offset="0.45" stop-color="#762CF0"/>
      <stop offset="1" stop-color="#1460FF"/>
    </linearGradient>
    <radialGradient id="mo-sheen" cx="0.32" cy="0.05" r="0.95">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mo-magenta" cx="0.14" cy="0.10" r="0.7">
      <stop offset="0" stop-color="#E01C7A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#E01C7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="mo-vignette" cx="1.0" cy="1.0" r="0.85">
      <stop offset="0.5" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.34"/>
    </radialGradient>
    <linearGradient id="mo-arrow" x1="238" y1="660" x2="700" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E1EEFF"/>
    </linearGradient>
    <radialGradient id="mo-orb" cx="0.5" cy="0.36" r="0.62">
      <stop offset="0" stop-color="#8CF2FF"/>
      <stop offset="1" stop-color="#0796CD"/>
    </radialGradient>
    <radialGradient id="mo-orbglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#0DCAF0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0DCAF0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="mo-clip"><rect width="1024" height="1024" rx="230" ry="230"/></clipPath>
    <filter id="mo-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0A0E1C" flood-opacity="0.40"/>
    </filter>
  </defs>

  <g clip-path="url(#mo-clip)">
    <rect width="1024" height="1024" fill="url(#mo-bg)"/>
    <rect width="1024" height="1024" fill="url(#mo-magenta)"/>
    <rect width="1024" height="1024" fill="url(#mo-sheen)"/>
    <rect width="1024" height="1024" fill="url(#mo-vignette)"/>

    <!-- faint signal-dot starfield -->
    <g>
      <circle cx="164" cy="184" r="6" fill="#0DCAF0" opacity="0.22"/>
      <circle cx="860" cy="143" r="5" fill="#fff" opacity="0.17"/>
      <circle cx="113" cy="430" r="4" fill="#fff" opacity="0.13"/>
      <circle cx="922" cy="369" r="7" fill="#0DCAF0" opacity="0.23"/>
      <circle cx="881" cy="819" r="6" fill="#0DCAF0" opacity="0.20"/>
      <circle cx="532" cy="102" r="4" fill="#fff" opacity="0.14"/>
    </g>

    <!-- glassy ascending chart bars -->
    <g>
      <rect x="271" y="602" width="58" height="150" rx="20" fill="#fff" opacity="0.13"/>
      <rect x="383" y="502" width="58" height="250" rx="20" fill="#fff" opacity="0.13"/>
      <rect x="495" y="404" width="58" height="348" rx="20" fill="#fff" opacity="0.13"/>
      <rect x="607" y="300" width="58" height="452" rx="20" fill="#fff" opacity="0.13"/>
      <rect x="719" y="196" width="58" height="556" rx="20" fill="#fff" opacity="0.13"/>
    </g>

    <!-- growth pulse arrow -->
    <g filter="url(#mo-shadow)">
      <path d="M238 648 L372 548 L470 596 L602 408 L690 318 L752.5 257.7"
            fill="none" stroke="url(#mo-arrow)" stroke-width="62"
            stroke-linecap="round" stroke-linejoin="round"/>
      <polygon points="806,206 779.4,351.3 660,227.5" fill="url(#mo-arrow)"/>
    </g>

    <!-- cyan signal-origin node -->
    <circle cx="238" cy="648" r="92" fill="url(#mo-orbglow)"/>
    <circle cx="238" cy="648" r="52" fill="#ffffff"/>
    <circle cx="238" cy="648" r="42" fill="url(#mo-orb)"/>
    <circle cx="238" cy="648" r="13" fill="#ffffff"/>
    <circle cx="222" cy="632" r="9" fill="#ffffff" opacity="0.9"/>

    <!-- glass rim -->
    <rect x="3" y="3" width="1018" height="1018" rx="227" ry="227"
          fill="none" stroke="#ffffff" stroke-opacity="0.24" stroke-width="2"/>
  </g>
</svg>
